name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The exported Next.js UI (restory/ui/out) is a gitignored build artifact,
      # so it is absent on a fresh checkout. pyproject.toml force-includes that
      # path into the wheel, which makes `pip install -e .` fail with
      # "Forced include not found" when it is missing. The Python test suite does
      # not exercise the built UI (the server degrades gracefully without it and
      # no test asserts its contents), so instead of installing Node and running
      # a full `npm run build`, we drop in a tiny placeholder to satisfy the
      # packaging requirement. This keeps CI fast and free of a JS toolchain.
      # The stub must mirror the structural shape the server-shell tests assert
      # on (test_server.py): a <head> for the token bootstrap to be injected into
      # and at least one bundle-style <script src=…> so the "bootstrap runs before
      # the bundle scripts" contract can be verified. A real `npm run build`
      # produces the same shape (head + /_next/static chunks) without a JS
      # toolchain in CI.
      - name: Create UI placeholder (skip UI build)
        shell: bash
        run: |
          mkdir -p restory/ui/out
          cat > restory/ui/out/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>restory UI (CI test stub)</title>
          </head>
          <body>
          <div id="__next"></div>
          <script src="/_next/static/chunks/main.js"></script>
          </body>
          </html>
          HTML

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # --basetemp points pytest at the runner's clean temp root. The default
      # tmp_path base can trip a Windows "WinError 5 (Access is denied)" when the
      # working tree lives on a synced/locked path; an explicit, fresh basetemp
      # outside the workspace avoids that. The textual TUI tests drive the app
      # through textual's headless Pilot harness (App.run_test), so they need no
      # real TTY and run unchanged in CI.
      - name: Run tests
        shell: bash
        run: pytest -v --basetemp="${{ runner.temp }}/pytest-restory"
