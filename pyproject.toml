[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restory"
version = "1.0.4"
description = "Restory CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
    "textual>=0.60",
]

[project.optional-dependencies]
# Test/dev tooling. httpx backs FastAPI's starlette TestClient, which the
# server tests use to drive GET /api/events and POST /api/undo; without it
# those tests error at client construction. Install with: pip install -e ".[test]".
test = [
    "pytest>=7",
    "httpx>=0.27",
]

[project.scripts]
restory = "restory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["restory"]

# The exported Next.js UI (restory/ui/out) is a build artifact and gitignored,
# so hatchling's default VCS-based file selection would leave it out of the
# wheel. Force-include it explicitly so `restory open` works after pip install.
[tool.hatch.build.targets.wheel.force-include]
"restory/ui/out" = "restory/ui/out"

[tool.hatch.build.targets.sdist.force-include]
"restory/ui/out" = "restory/ui/out"
