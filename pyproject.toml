[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restory"
version = "1.1.0"
description = "Local-first guardrails for AI coding agents: block dangerous commands, record a timeline, and roll back a session."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "claude-code", "security", "developer-tools", "agent-security", "llm", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    # Cap starlette to a verified-working range. fastapi pulls starlette in
    # transitively with only a lower bound, so an unpinned CI/install can jump to
    # a new starlette line whose test client (used by tests/test_server.py) hard-
    # requires a different HTTP client and breaks collection. 1.6.x is the line
    # this release is tested against; widen deliberately, not by accident.
    "starlette>=1.6,<1.7",
    "uvicorn>=0.29",
    "rich>=13",
    "textual>=0.60",
]

[project.optional-dependencies]
# Optional native desktop notifications on BLOCK (opt-in via RESTORY_NOTIFY=1).
# Platform-specific backends: windows-toasts gives real WinRT toasts on Windows
# 10/11 (plyer only emits an unreliable legacy tray balloon there); plyer covers
# macOS/Linux via osascript/notify-send with zero required transitive deps.
# Install with `pip install "restory[notify]"`. If absent, notifications no-op.
notify = [
    'windows-toasts>=1.1.0; sys_platform == "win32"',
    'plyer>=2.1; sys_platform != "win32"',
]
# Test-only dependencies. httpx is the HTTP client starlette's TestClient needs;
# it is not a runtime dependency of restory, so it lives here and is installed in
# CI via `pip install -e ".[test]"`. pytest-cov backs the CI coverage job
# (`pytest --cov=restory`). Keep httpx: dropping it breaks test collection.
test = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/DarkAxiom93/Restory"
Repository = "https://github.com/DarkAxiom93/Restory"
Issues = "https://github.com/DarkAxiom93/Restory/issues"

[project.scripts]
restory = "restory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["restory"]

# The exported Next.js UI (restory/ui/out) is a build artifact and gitignored,
# so hatchling's default VCS-based file selection would leave it out of the
# wheel. Force-include it explicitly so `restory open` works after pip install.
[tool.hatch.build.targets.wheel.force-include]
"restory/ui/out" = "restory/ui/out"

[tool.hatch.build.targets.sdist.force-include]
"restory/ui/out" = "restory/ui/out"

[tool.ruff]
# Match the project's minimum supported Python (see requires-python above).
target-version = "py310"
line-length = 100
# The exported Next.js UI and local virtualenvs are not our source to lint.
extend-exclude = ["restory/ui", "test-env"]
