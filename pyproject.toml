[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restory"
version = "0.1.1"
description = "Restory CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
]

[project.scripts]
restory = "restory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["restory"]
