[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restory"
version = "1.0.6"
description = "Local-first guardrails for AI coding agents: block dangerous commands, record a timeline, and roll back a session."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "claude-code", "security", "developer-tools", "agent-security", "llm", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    # Cap starlette to a verified-working range. fastapi pulls starlette in
    # transitively with only a lower bound, so an unpinned CI/install can jump to
    # a new starlette line whose test client (used by tests/test_server.py) hard-
    # requires a different HTTP client and breaks collection. 1.6.x is the line
    # this release is tested against; widen deliberately, not by accident.
    "starlette>=1.6,<1.7",
    "uvicorn>=0.29",
    "rich>=13",
    "textual>=0.60",
]

[project.optional-dependencies]
# Test-only dependencies. httpx is the HTTP client starlette's TestClient needs;
# it is not a runtime dependency of restory, so it lives here and is installed in
# CI via `pip install -e ".[test]"`.
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/DarkAxiom93/Restory"
Repository = "https://github.com/DarkAxiom93/Restory"
Issues = "https://github.com/DarkAxiom93/Restory/issues"

[project.scripts]
restory = "restory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["restory"]

# The exported Next.js UI (restory/ui/out) is a build artifact and gitignored,
# so hatchling's default VCS-based file selection would leave it out of the
# wheel. Force-include it explicitly so `restory open` works after pip install.
[tool.hatch.build.targets.wheel.force-include]
"restory/ui/out" = "restory/ui/out"

[tool.hatch.build.targets.sdist.force-include]
"restory/ui/out" = "restory/ui/out"
