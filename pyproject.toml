[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restory"
version = "1.0.4"
description = "Restory CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
    "textual>=0.60",
]

[project.optional-dependencies]
# Optional native desktop notifications on BLOCK (opt-in via RESTORY_NOTIFY=1).
# Platform-specific backends: windows-toasts gives real WinRT toasts on Windows
# 10/11 (plyer only emits an unreliable legacy tray balloon there); plyer covers
# macOS/Linux via osascript/notify-send with zero required transitive deps.
# Install with `pip install "restory[notify]"`. If absent, notifications no-op.
notify = [
    'windows-toasts>=1.1.0; sys_platform == "win32"',
    'plyer>=2.1; sys_platform != "win32"',
]
# Test/dev dependencies. Install with `pip install -e ".[test]"`.
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
restory = "restory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["restory"]

# The exported Next.js UI (restory/ui/out) is a build artifact and gitignored,
# so hatchling's default VCS-based file selection would leave it out of the
# wheel. Force-include it explicitly so `restory open` works after pip install.
[tool.hatch.build.targets.wheel.force-include]
"restory/ui/out" = "restory/ui/out"

[tool.hatch.build.targets.sdist.force-include]
"restory/ui/out" = "restory/ui/out"
